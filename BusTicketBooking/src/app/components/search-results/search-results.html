<h2 class="title">Available Buses</h2>

<div *ngIf="buses$ | async as buses">

  <div *ngIf="buses.length > 0; else noData" class="bus-container">

    <div *ngFor="let bus of buses" class="bus-card">

      <!-- LEFT SECTION -->
      <div class="bus-left">
        <h3 class="bus-name">{{ bus.busName }}</h3>
        <p class="bus-route">
          {{ bus.source }} → {{ bus.destination }}
        </p>
        <p class="bus-time">
          Departure: {{ bus.departureTime }}
        </p>
      </div>

      <!-- MIDDLE SECTION -->
      <div class="bus-middle">
        <p class="bus-duration">🕒 On Time</p>
      </div>

      <!-- RIGHT SECTION -->
      <div class="bus-right">
        <h2 class="price">₹{{ bus.price }}</h2>
        <button (click)="selectBus(bus)" class="book-btn">
          Select Seat
        </button>
      </div>

    </div>

  </div>

</div>

<ng-template #noData>
  <p class="no-data">No buses found for this route.</p>
</ng-template>
