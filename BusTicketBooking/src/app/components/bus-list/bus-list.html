<h2 class="title">All Buses</h2>

<div *ngIf="buses$ | async as buses; else loading">

  <div *ngIf="buses.length > 0; else noData" class="bus-container">

    <div *ngFor="let bus of buses" class="bus-card">

      <!-- LEFT -->
      <div class="bus-left">
        <h3 class="bus-name">{{ bus.busName }}</h3>
        <p class="bus-route">
          {{ bus.source }} → {{ bus.destination }}
        </p>
        <p class="bus-time">
          Departure: {{ bus.departureTime }}
        </p>
      </div>

      <!-- MIDDLE -->
      <div class="bus-middle">
        <p class="bus-duration">🕒 {{ bus.journeyDate }}</p>
      </div>

      <!-- RIGHT -->
      <div class="bus-right">
        <h2 class="price">₹{{ bus.price }}</h2>

        <button (click)="selectBus(bus.busId)" class="book-btn">
          Select Seat
        </button>
      </div>

    </div>

  </div>

</div>

<ng-template #loading>
  <p>Loading buses...</p>
</ng-template>

<ng-template #noData>
  <p class="no-data">No buses available.</p>
</ng-template>
